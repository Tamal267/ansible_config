---
- name: "Check for an existing {{ restore_app.name }} installation outside APT"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, shutil, sys
        present = shutil.which(sys.argv[1]) or os.path.isfile('/snap/bin/' + sys.argv[1])
        sys.exit(0 if present else 1)
      - "{{ restore_app.executable }}"
  register: restore_vendor_present
  changed_when: false
  failed_when: restore_vendor_present.rc not in [0, 1]
  check_mode: no

- name: "Install missing {{ restore_app.name }}"
  when: restore_vendor_present.rc == 1
  block:
    - name: Ensure HTTPS certificate support is installed
      ansible.builtin.apt:
        name: ca-certificates
        state: present

    - name: Install a missing browser or editor using its official DEB
      when: restore_app.deb_url is defined and not ansible_check_mode
      block:
        - name: Create a temporary directory for the installer
          ansible.builtin.tempfile:
            state: directory
            prefix: restore-app-
          register: restore_vendor_tmp

        - name: Download the vendor DEB over HTTPS
          ansible.builtin.get_url:
            url: "{{ restore_app.deb_url }}"
            dest: "{{ restore_vendor_tmp.path }}/installer.deb"
            mode: '0644'

        - name: Install the missing vendor application and dependencies
          ansible.builtin.apt:
            deb: "{{ restore_vendor_tmp.path }}/installer.deb"
      always:
        - name: Remove the temporary vendor installer
          ansible.builtin.file:
            path: "{{ restore_vendor_tmp.path }}"
            state: absent
          when: restore_vendor_tmp.path is defined

    - name: Restore Sublime Text from its signed stable repository
      when: restore_app.package == 'sublime-text'
      block:
        - name: Read the existing Sublime APT candidate
          ansible.builtin.command: apt-cache policy sublime-text
          register: restore_sublime_candidate
          changed_when: false
          check_mode: no

        - name: Add the Sublime repository if there is no existing candidate
          when: "restore_sublime_candidate.stdout is not search('Candidate: (?!\\(none\\))\\S+')"
          block:
            - name: Ensure the APT key directory exists
              ansible.builtin.file:
                path: /etc/apt/keyrings
                state: directory
                mode: '0755'

            - name: Download the official Sublime signing key
              ansible.builtin.get_url:
                url: https://download.sublimetext.com/sublimehq-pub.gpg
                dest: /etc/apt/keyrings/sublimehq-pub.asc
                mode: '0644'

            - name: Restore the Sublime stable APT source
              ansible.builtin.copy:
                dest: /etc/apt/sources.list.d/sublime-text.list
                content: "deb [signed-by=/etc/apt/keyrings/sublimehq-pub.asc] https://download.sublimetext.com/ apt/stable/\n"
                mode: '0644'

            - name: Refresh APT after adding Sublime
              ansible.builtin.apt:
                update_cache: yes
              when: not ansible_check_mode

        - name: Install missing Sublime Text
          ansible.builtin.apt:
            name: sublime-text
            state: present
          when: not ansible_check_mode

    - name: Report the missing vendor installation in dry-run mode
      ansible.builtin.debug:
        msg: "Would install {{ restore_app.name }}; vendor installation is skipped during --check."
      when: ansible_check_mode
