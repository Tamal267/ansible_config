---
- name: Read current applications and the saved cleanup record
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/scripts/editor_inventory.py"
    executable: python3
  register: restore_editor_inventory
  changed_when: false
  check_mode: no

- name: Read application restore details
  ansible.builtin.set_fact:
    restore_editors: "{{ restore_editor_inventory.stdout | from_json }}"

- name: Restore missing recorded Snap applications without refreshing installed snaps
  ansible.builtin.command:
    argv: "{{ item.install }}"
  loop: "{{ restore_editors.missing.snap }}"
  loop_control:
    label: "{{ item.key }}"
  when: not ansible_check_mode

- name: Restore missing recorded system and per-user Flatpak applications
  ansible.builtin.command:
    argv: "{{ item.install }}"
  loop: "{{ restore_editors.missing.flatpak }}"
  loop_control:
    label: "{{ item.key }}"
  when: not ansible_check_mode

- name: Refresh application inventory after restoring store applications
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/scripts/editor_inventory.py"
    executable: python3
  register: restore_editor_inventory_after_stores
  changed_when: false
  check_mode: no

- name: Refresh application details after restoring store applications
  ansible.builtin.set_fact:
    restore_editors: "{{ restore_editor_inventory_after_stores.stdout | from_json }}"

- name: Restore missing recorded APT application packages
  ansible.builtin.apt:
    name: "{{ restore_editors.saved.apt | default([]) | difference(ansible_facts.packages.keys() | list) | difference(restore_editors.non_apt_packages) | difference(['code', 'sublime-text', 'codeblocks', 'codeblocks-common', 'codeblocks-contrib']) }}"
    state: present
  when: restore_editors.saved.apt | default([]) | difference(ansible_facts.packages.keys() | list) | difference(restore_editors.non_apt_packages) | difference(['code', 'sublime-text', 'codeblocks', 'codeblocks-common', 'codeblocks-contrib']) | length > 0

- name: Restore basic desktop applications when cleanup predates the saved record
  ansible.builtin.apt:
    name: "{{ ['nano', 'gedit', 'gnome-text-editor', 'gnome-calculator', 'eog', 'mpv', 'totem'] | difference(ansible_facts.packages.keys() | list) | difference(restore_editors.non_apt_packages) }}"
    state: present
  when:
    - restore_editors.saved | length == 0
    - "['nano', 'gedit', 'gnome-text-editor', 'gnome-calculator', 'eog', 'mpv', 'totem'] | difference(ansible_facts.packages.keys() | list) | difference(restore_editors.non_apt_packages) | length > 0"

- name: Report the planned Snap and Flatpak application restoration in check mode
  ansible.builtin.debug:
    msg: "Would restore Snap applications {{ restore_editors.missing.snap | map(attribute='key') | list }} and Flatpak applications {{ restore_editors.missing.flatpak | map(attribute='key') | list }}."
  when: ansible_check_mode
